<style>

:root{color-scheme:dark;--bg:#090e1e;--surface:#171b2d;--surface2:#222339;--line:#393b58;--text:#fff8f6;--muted:#a9abc1;--pink:#ff8ab9;--pink2:#ffc2ce;--orange:#ffc494;--teal:#78dece}

.wrap{max-width:1310px;margin:auto;padding-left:28px;padding-right:28px}
.topbar{height:68px;display:flex;align-items:center;background:#0d1020dd;border-bottom:1px solid #ffd2e61a;backdrop-filter:blur(16px)}
.topbar .wrap{width:100%}
.brand{height:100%;display:flex;align-items:center;gap:12px;font-family:Impact,"Arial Black",sans-serif;letter-spacing:.03em;font-size:23px}

.hero-counter strong{font:900 46px/1 Impact,"Arial Black",sans-serif;color:#ffb6d0}.hero-counter small{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:#d8c3d3;margin-top:8px}

.stat{padding:19px 23px 20px;border:1px solid #ffffff25;border-radius:10px;background:linear-gradient(125deg,#1a2033,#161a2b);position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;bottom:0;left:0;height:2px;width:42%;background:linear-gradient(90deg,#fba0c3,transparent)}

.stat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.stat-label{color:#d5c4d8;font-size:10px;letter-spacing:.15em;font-weight:850;text-transform:uppercase}

.stat:nth-child(2) .fill{background:linear-gradient(90deg,#77dace,#b5f5d9)}
.catalog-heading{display:flex;align-items:center;gap:13px;margin:0 0 13px;color:#aab0c2;letter-spacing:.17em;font-size:10px;text-transform:uppercase;font-weight:850}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}

#category{flex:0 1 225px}#sort{flex:0 1 170px}
.tabs{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.primary-tabs{margin-bottom:10px}.secondary-tabs{margin-bottom:24px}
.tab{background:#1b1f31;border:1px solid #ffffff25;border-radius:6px;padding:9px 15px;color:#b5bacb;font-size:12px;font-weight:800;transition:background .16s,border-color .16s}
.tab:hover{background:#303049;border-color:#ffc9dc7a;color:#fff}
.tab.active{color:#ffecf3;background:linear-gradient(105deg,#713c63,#563451);border-color:#ffa3c4a6}
.secondary-tabs .tab{padding:7px 12px;font-size:11px}
.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid #ffffff26;margin:0 0 16px}
.results-head h2{margin:0;font:800 23px/1.2 Inter,"Segoe UI",sans-serif;letter-spacing:-.04em}
#results{color:#b3b6c8;font-size:12px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vehicle{position:relative;min-height:105px;width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:16px;background:linear-gradient(125deg,#1c2235,#181c2d);border:1px solid #ffffff25;border-radius:9px;color:var(--text);transition:background .16s,border-color .16s,transform .16s;overflow:hidden}
.vehicle::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#e88dba21;transition:background .16s}
.vehicle:hover{background:linear-gradient(125deg,#30273e,#202139);border-color:#ff9cc67f;transform:translateY(-1px)}
.vehicle:hover::before{background:#ff8fbc}
.vehicle.checked{background:linear-gradient(100deg,#1e3c3a,#1b2b35);border-color:#71cbb274}
.vehicle.checked::before{background:#7ce7c8}
.boxcheck{display:grid;place-items:center;flex:0 0 25px;width:25px;height:25px;border:1.5px solid #8b90a9;border-radius:5px;font-size:17px;font-weight:900;color:transparent;background:#101625}
.vehicle.checked .boxcheck{background:#80e6c8;color:#10282a;border-color:#80e6c8}
.vehicle-info{min-width:0;display:flex;flex-direction:column}
.vehicle-brand{font-size:10px;font-weight:900;letter-spacing:.13em;color:#ffa3ca;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vehicle-model{font-size:16px;font-weight:800;letter-spacing:-.03em;margin:3px 0;line-height:1.25;overflow-wrap:anywhere}
.vehicle-category{font-size:11px;color:#a0a7b9;line-height:1.35;overflow-wrap:anywhere}
.vehicle.checked .vehicle-brand{color:#8ce5cd}.vehicle.checked .vehicle-model{color:#dcfff1}

@media(max-width:360px){h1{font-size:47px}.stat-count{font-size:20px}.tab{padding:7px 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}


/* Navigation · GTA VI sunset visual */
.topbar{position:sticky;top:0;z-index:50;height:auto;min-height:74px;box-shadow:0 12px 28px #080a194a}
.topbar-content{width:100%;display:flex;align-items:center;justify-content:space-between;gap:32px;min-height:74px}
.brand{text-decoration:none;color:var(--text);white-space:nowrap;flex-shrink:0}
.main-nav{height:74px;display:flex;align-items:stretch;gap:8px;min-width:0}
.nav-item{position:relative;display:flex;align-items:center;gap:9px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;color:#bdbbd0;font-weight:800;white-space:nowrap;transition:background .18s,color .18s}
.nav-item svg{flex:0 0 auto;color:#d6b3ca}

.set-section{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 2px;padding:13px 0 5px;border-top:1px solid #ffffff22}
.set-section:first-child{margin-top:0;border:0;padding-top:2px}
.set-section h3{font-size:17px;line-height:1.3;font-weight:850;letter-spacing:-.025em;margin:0}
.set-section span{color:#dfa4c5;font-size:12px;white-space:nowrap;font-weight:800}
.vehicle-category{font-size:11px}
#typeTabs[hidden]{display:none}
.main-nav small{font-variant-numeric:tabular-nums}.label-short{display:none}
@media(max-width:1100px){.topbar-content{gap:12px}.brand{font-size:21px}.nav-item{padding-left:10px;padding-right:10px;gap:6px}}
@media(max-width:830px){.topbar-content{flex-direction:column;align-items:stretch;gap:0;min-height:auto;padding-top:10px}.brand{height:42px}.main-nav{height:54px;width:100%;gap:4px;overflow-x:auto;scrollbar-width:none}.main-nav::-webkit-scrollbar{display:none}.nav-item{padding:0 12px;flex-shrink:0;font-size:12px}}
@media(max-width:650px){.topbar{height:auto}.hero{min-height:255px}.main-nav{overflow:visible}.nav-item{flex:1;justify-content:center;padding:0 7px}.nav-item small{display:none}.nav-item svg{width:16px;height:16px}.nav-item span{font-size:12px}.nav-item .label-long{display:none}.nav-item .label-short{display:inline}.brand{font-size:20px}.set-section h3{font-size:15px}}

/* Cuatro jugadores · comparación */
.profile-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 18px;margin:0 0 18px;border-radius:11px;border:1px solid #ffffff26;background:linear-gradient(110deg,#1b1f35,#211e37 70%,#352640)}
.profile-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.profile-label{font-size:10px;font-weight:900;color:#d7b9d0;letter-spacing:.17em;text-transform:uppercase}
.profile-tabs{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.profile-tab{--player-color:#ff9dbd;display:flex;align-items:center;gap:8px;border:1px solid #ffffff35;border-radius:7px;background:#13192c;padding:7px 13px 7px 7px;font-size:12px;font-weight:800;color:#c9c4d5;transition:background .16s,border .16s}
.profile-tab:hover{background:#30283d;border-color:#ffffff70}
.profile-tab.active{color:#fff;border-color:var(--player-color);background:color-mix(in srgb,var(--player-color) 18%,#151c2a);box-shadow:0 0 0 1px color-mix(in srgb,var(--player-color) 16%,transparent)}

.profile-tab[data-profile="ruru"],.person-pill[data-profile="ruru"],.compare-stat[data-profile="ruru"]{--player-color:#ffa9c7}
.profile-tab[data-profile="duque"],.person-pill[data-profile="duque"],.compare-stat[data-profile="duque"]{--player-color:#94e3d6}
.profile-tab[data-profile="coco"],.person-pill[data-profile="coco"],.compare-stat[data-profile="coco"]{--player-color:#ffd49c}
.profile-tab[data-profile="rays"],.person-pill[data-profile="rays"],.compare-stat[data-profile="rays"]{--player-color:#c9b3ff}
.compare-toggle{display:inline-flex;gap:9px;align-items:center;justify-content:center;border-radius:7px;border:1px solid #ffa6cb7d;color:#ffe7f4;background:#543450;padding:10px 14px;font-weight:850;font-size:12px;white-space:nowrap}
.compare-toggle:hover,.compare-toggle.active{background:linear-gradient(105deg,#9c537e,#644576);border-color:#ffd4e4}
.compare-toggle svg{width:17px;height:17px}
#singleSummary[hidden],#compareOverview[hidden],#statusTabs[hidden],#compareFilters[hidden],#legacyBanner[hidden]{display:none!important}
.compare-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:26px}
.compare-stat{position:relative;border:1px solid #ffffff26;border-radius:10px;padding:15px 17px 16px;background:linear-gradient(120deg,#20263a,#171c2d)}
.compare-stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px;background:var(--player-color)}
.compare-stat .person-name{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:850;color:var(--player-color)}
.compare-stat .person-amount{font-size:23px;font-weight:900;margin:8px 0 10px}
.compare-stat .person-amount small{font-size:12px;color:#9298ad;font-weight:500}

.compare-filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:1px 0 22px}
.compare-filters .tabs{flex:1;min-width:260px}
.compare-filters select{flex:0 1 175px;font-size:12px;height:41px}
.compare-filters .tab{font-size:11px;padding:9px 11px}
#cards.compare-list{display:block;border:1px solid #ffffff25;border-radius:10px;overflow:hidden;background:#151a2b}
.compare-head,.compare-row{display:grid;grid-template-columns:minmax(255px,1fr) repeat(4,minmax(112px,133px));align-items:stretch;min-width:700px}
.compare-head{position:relative;z-index:1;background:#29243b;color:#e8d0df;border-bottom:1px solid #ffffff29;font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:850}
.compare-head>div{padding:13px 12px;text-align:center;border-left:1px solid #ffffff11}
.compare-head>div:first-child{text-align:left;padding-left:19px;border-left:0}
.compare-head .head-initial{width:21px;height:21px;display:inline-grid;place-items:center;font-size:10px;border-radius:4px;background:#ffffff17;margin-right:6px}
.compare-row{border-bottom:1px solid #ffffff15;min-height:74px;transition:background .16s}
.compare-row:nth-child(odd){background:#ffffff03}
.compare-row:hover{background:#ffa0c40b}
.compare-row:last-child{border-bottom:0}
.compare-item{display:flex;min-width:0;flex-direction:column;justify-content:center;padding:11px 13px 11px 19px}
.compare-name{font-size:14px;font-weight:850;line-height:1.25;overflow-wrap:anywhere}
.compare-detail{font-size:11px;color:#a5a5bd;margin-top:4px;overflow-wrap:anywhere}
.person-pill{width:100%;height:100%;min-height:57px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-left:1px solid #ffffff0f;color:#a9adc1;background:transparent;font-size:12px;font-weight:850;transition:background .14s}

.person-pill .pill-icon{width:23px;height:23px;display:grid;place-items:center;border-radius:5px;border:1px solid #666e8f;color:#8991ac;font-weight:900;flex-shrink:0}
.person-pill.checked{color:var(--player-color);background:color-mix(in srgb,var(--player-color) 10%,transparent)}
.person-pill.checked .pill-icon{background:var(--player-color);border-color:var(--player-color);color:#182032}
.person-pill .pill-name{display:none}
.compare-list .set-section{margin:0;padding:11px 19px;background:#32253c;border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22;min-width:700px}
.compare-list .set-section h3{font-size:14px}
.compare-list .empty{border:0}
.legacy-banner{padding:13px 16px;margin:0 0 18px;border:1px solid #ffce9d60;background:#49392844;border-radius:9px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#f8e5d3}
.legacy-banner strong{font-size:12px;flex:1 1 260px}
.legacy-banner select{height:37px;font-size:12px}
.legacy-banner button{border:1px solid #ffc89861;border-radius:5px;padding:9px 12px;background:#6b4650;color:#fff;font-size:12px;font-weight:800}
.legacy-banner .skip{background:transparent;color:#cabdc9;border-color:#ffffff30}
.compare-hero-name{font-size:11px;color:#f4d5e8;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-left:5px}
@media(max-width:1120px){.compare-head,.compare-row{grid-template-columns:minmax(200px,1fr) repeat(4,minmax(95px,1fr))}}
@media(max-width:800px){.compare-overview{grid-template-columns:repeat(2,minmax(0,1fr))}.compare-head{display:none}.compare-row{min-width:0;grid-template-columns:repeat(4,minmax(0,1fr));padding:12px 10px 10px;gap:8px 5px}.compare-item{grid-column:1/-1;padding:0 4px 6px}.person-pill{border:1px solid #ffffff29;border-radius:6px;min-height:43px;flex-direction:column;gap:3px;padding:7px 2px}.person-pill .pill-name{display:inline;font-size:10px}.person-pill .pill-icon{width:21px;height:21px}.compare-list .set-section{min-width:0}.compare-filters select{flex:1 1 140px}.profile-toolbar{align-items:stretch}.compare-toggle{margin-left:auto}}
@media(max-width:530px){.profile-toolbar{padding:12px;gap:10px}.profile-left{gap:8px;width:100%}.profile-label{width:100%}.profile-tabs{gap:5px;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.profile-tab{justify-content:center;padding:7px 4px;gap:4px;font-size:11px}.profile-tab .initial{width:20px;height:22px;flex-basis:20px;font-size:10px}.compare-toggle{width:100%;margin:0}.compare-overview{gap:8px}.compare-stat{padding:12px}.compare-stat .person-amount{font-size:20px}.compare-filters .tabs{min-width:0;width:100%;justify-content:stretch}.compare-filters .tab{flex:1 1 38%;padding:9px 6px;font-size:10px}.person-pill .pill-name{font-size:10px}.compare-name{font-size:14px}}

const STORAGE_KEY='vice-garage-gta6-v1';
const ANIMAL_KEY='vice-tracker-animals-v1';
const CARD_KEY='vice-tracker-cards-v1';
const TEAM_KEY='vice-tracker-team-v1';
const PLAYERS=[{id:'ruru',name:'Ruru'},{id:'duque',name:'Duque'},{id:'coco',name:'Coco'},{id:'rays',name:'Rays'}];
const CATEGORIES=['vehiculos','animales','cartas'];
let player='ruru',comparing=false,section='vehiculos',custom=[];
let team=Object.fromEntries(PLAYERS.map(p=>[p.id,{vehiculos:new Set(),animales:new Set(),cartas:new Set()}]));
let kind='all',status='all',category='',query='',sorting='model',diff='all',hasPlayer='',missingPlayer='';
let oldMarks={vehiculos:[],animales:[],cartas:[]},legacyHandled=false;
const $=s=>document.querySelector(s);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const byText=(a,b)=>a.localeCompare(b,'es',{sensitivity:'base',numeric:true});
const all=()=>section==='vehiculos'?CATALOG.concat(custom):section==='animales'?ANIMALS:CARDS;
const activeMarks=()=>team[player][section];
const isBase=v=>v.tipo!=='especial';
function marksOf(who,part=section){return team[who][part]}
function completedSets(who){return CARD_SETS.reduce((sum,[set,total])=>sum+(CARDS.filter(c=>c.categoria===set&&marksOf(who,'cartas').has(c.id)).length===total?1:0),0)}
function goal(){return section==='vehiculos'?200:section==='animales'?100:15}
function registered(who){return all().filter(v=>marksOf(who).has(v.id)).length}
function goalCount(who){return section==='vehiculos'?all().filter(v=>isBase(v)&&marksOf(who).has(v.id)).length:section==='animales'?registered(who):completedSets(who)}
function restore(){
  try{const legacy=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(legacy){
    if(Array.isArray(legacy.marks))oldMarks.vehiculos=legacy.marks.filter(v=>typeof v==='string');
    if(Array.isArray(legacy.custom))custom=legacy.custom.filter(x=>x&&typeof x.id==='string'&&typeof x.marca==='string'&&typeof x.modelo==='string'&&typeof x.categoria==='string').map(x=>({...x,custom:true})).slice(0,1000);
  }}catch(e){console.warn('No se pudieron leer las marcas antiguas',e)}
  try{const animals=JSON.parse(localStorage.getItem(ANIMAL_KEY)||'[]');if(Array.isArray(animals))oldMarks.animales=animals.filter(v=>typeof v==='string')}catch(e){}
  try{const cards=JSON.parse(localStorage.getItem(CARD_KEY)||'[]');if(Array.isArray(cards))oldMarks.cartas=cards.filter(v=>typeof v==='string')}catch(e){}
  try{const raw=JSON.parse(localStorage.getItem(TEAM_KEY)||'null');if(raw&&raw.players){
    for(const person of PLAYERS){for(const part of CATEGORIES){let a=raw.players[person.id]?.[part];if(Array.isArray(a))team[person.id][part]=new Set(a.filter(v=>typeof v==='string'))}}
    if(PLAYERS.some(p=>p.id===raw.active))player=raw.active;
    comparing=raw.comparing===true;legacyHandled=raw.legacyHandled===true;
  }}catch(e){console.warn('No se pudo abrir el progreso por jugador',e)}
  showLegacy();
}
function save(){try{
  localStorage.setItem(TEAM_KEY,JSON.stringify({version:1,players:Object.fromEntries(PLAYERS.map(p=>[p.id,Object.fromEntries(CATEGORIES.map(c=>[c,[...team[p.id][c]]]))])),active:player,comparing,legacyHandled,updated:new Date().toISOString()}));
}catch(e){console.warn('No se ha podido guardar el progreso',e)}}
function showLegacy(){const hasOld=CATEGORIES.some(c=>oldMarks[c].length);$('#legacyBanner').hidden=!hasOld||legacyHandled}
function migrateOld(){const who=$('#legacyOwner').value;if(!team[who])return;
  for(const part of CATEGORIES)for(const item of oldMarks[part])team[who][part].add(item);
  legacyHandled=true;save();showLegacy();render();
}
function updateProgress(){
  const items=all(),marked=registered(player),target=goalCount(player);
  $('#done').textContent=marked;$('#total').textContent=items.length;
  $('#platDone').textContent=target;$('#goalTotal').textContent=goal();
  $('#totalFill').style.width=(items.length?marked/items.length*100:0)+'%';
  $('#platFill').style.width=(Math.min(goal(),target)/goal()*100)+'%';
  $('#totalProgress').setAttribute('aria-valuenow',marked);$('#totalProgress').setAttribute('aria-valuemax',items.length);
  $('#platProgress').setAttribute('aria-valuenow',Math.min(goal(),target));$('#platProgress').setAttribute('aria-valuemax',goal());
  $('#navVehCount').textContent=CATALOG.length+custom.length;
  $('#heroDone').textContent=comparing?items.filter(x=>PLAYERS.some(p=>marksOf(p.id).has(x.id))).length:marked;
  document.querySelector('.hero-counter small').textContent=comparing?'Entre todos':'Registrados';
  $('#singleSummary').hidden=comparing;$('#compareOverview').hidden=!comparing;
  if(comparing){const frag=document.createDocumentFragment();for(const person of PLAYERS){
    const div=document.createElement('div');div.className='compare-stat';div.dataset.profile=person.id;
    const nm=document.createElement('div');nm.className='person-name';nm.textContent=person.name;
    const num=document.createElement('div');num.className='person-amount';num.textContent=registered(person.id)+' ';
    const sm=document.createElement('small');sm.textContent='/ '+items.length;num.append(sm);
    const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(items.length?100*registered(person.id)/items.length:0)+'%';track.append(fill);
    div.append(nm,num,track);frag.append(div);
  }$('#compareOverview').replaceChildren(frag)}
}
function options(){
  const values=section==='cartas'?CARD_SETS.map(a=>a[0]):[...new Set(all().filter(v=>section!=='vehiculos'||kind==='all'||(kind==='base'?isBase(v):!isBase(v))).map(v=>v.categoria))].sort(byText);
  const previous=category;
  $('#category').replaceChildren(new Option(section==='cartas'?'Todas las colecciones':'Categorías',''),...values.map(c=>new Option(c,c)));
  category=values.includes(previous)?previous:'';$('#category').value=category;
}
function itemList(){
  const seen=activeMarks();let out=all().filter(v=>{
    if(section==='vehiculos'&&kind!=='all'&&(kind==='base'?!isBase(v):isBase(v)))return false;
    if(category&&v.categoria!==category)return false;
    if(query&&!norm([v.marca,v.modelo,v.categoria,v.pos||''].join(' ')).includes(norm(query)))return false;
    if(comparing){
      const n=PLAYERS.filter(p=>marksOf(p.id).has(v.id)).length;
      if(diff==='different'&&(n===0||n===PLAYERS.length))return false;
      if(diff==='everyone'&&n!==PLAYERS.length)return false;
      if(diff==='nobody'&&n!==0)return false;
      if(hasPlayer&&!marksOf(hasPlayer).has(v.id))return false;
      if(missingPlayer&&marksOf(missingPlayer).has(v.id))return false;
    }else if(status!=='all'&&(status==='done')!==seen.has(v.id))return false;
    return true;
  });
  out.sort((a,b)=>{
    if(sorting==='checked'||sorting==='pending'){
      const n=v=>comparing?PLAYERS.filter(p=>marksOf(p.id).has(v.id)).length:Number(seen.has(v.id));
      const d=n(a)-n(b);if(d)return sorting==='checked'?-d:d;
    }
    if(section==='cartas')return sorting==='brand'?byText(a.modelo,b.modelo)||byText(a.marca,b.marca):(a.pos||0)-(b.pos||0);
    return sorting==='brand'?byText(a.marca,b.marca)||byText(a.modelo,b.modelo):byText(a.modelo,b.modelo)||byText(a.marca,b.marca);
  });return out;
}
function getItemName(v){return section==='cartas'?v.modelo+' ('+v.marca+')':(section==='animales'?v.modelo:v.marca+' '+v.modelo)}
function toggleMark(who,id){const set=marksOf(who);if(set.has(id))set.delete(id);else set.add(id);save();render()}
function itemButton(v){
  const checked=activeMarks().has(v.id),btn=document.createElement('button');btn.type='button';btn.className='vehicle'+(checked?' checked':'');btn.setAttribute('role','checkbox');btn.setAttribute('aria-checked',String(checked));
  btn.setAttribute('aria-label',(checked?'Desmarcar ':'Marcar ')+getItemName(v)+' para '+PLAYERS.find(p=>p.id===player).name);
  const check=document.createElement('span');check.className='boxcheck';check.textContent='✓';check.setAttribute('aria-hidden','true');
  const info=document.createElement('span');info.className='vehicle-info';
  const title=section==='cartas'?v.categoria:section==='animales'?v.categoria:v.marca;
  const detail=section==='cartas'?v.marca:section==='animales'?'':v.categoria;
  for(const [cls,txt] of [['vehicle-brand',title],['vehicle-model',v.modelo],['vehicle-category',detail]]){
    if(!txt)continue;const el=document.createElement('span');el.className=cls;el.textContent=txt;info.append(el);
  }
  btn.append(check,info);btn.addEventListener('click',()=>toggleMark(player,v.id));return btn;
}
function compareRow(v){
  const row=document.createElement('div');row.className='compare-row';row.setAttribute('role','row');
  const info=document.createElement('div');info.className='compare-item';info.setAttribute('role','cell');
  const title=document.createElement('span');title.className='compare-name';title.textContent=getItemName(v);
  const detail=document.createElement('span');detail.className='compare-detail';detail.textContent=section==='cartas'?v.categoria+' · '+v.marca:v.categoria;
  info.append(title,detail);row.append(info);
  for(const person of PLAYERS){const checked=marksOf(person.id).has(v.id),btn=document.createElement('button');btn.type='button';btn.dataset.profile=person.id;btn.className='person-pill'+(checked?' checked':'');
    btn.setAttribute('role','checkbox');btn.setAttribute('aria-checked',String(checked));btn.setAttribute('aria-label',person.name+(checked?' tiene ':' no tiene ')+getItemName(v)+'. Pulsar para cambiar');
    const icon=document.createElement('span');icon.className='pill-icon';icon.textContent=checked?'✓':'—';icon.setAttribute('aria-hidden','true');
    const name=document.createElement('span');name.className='pill-name';name.textContent=person.name;
    btn.append(icon,name);btn.addEventListener('click',()=>toggleMark(person.id,v.id));row.append(btn);
  }
  return row;
}
function render(){
  updateProgress();const result=itemList(),container=$('#cards');container.replaceChildren();container.className=comparing?'cards compare-list':'cards';
  const titles={vehiculos:{base:'Modelos base',especial:'Versiones especiales',all:'Todos los vehículos'},animales:'Todos los animales',cartas:'Todas las cartas'};
  $('#sectionTitle').textContent=category||((section==='vehiculos')?titles.vehiculos[kind]:titles[section]);
  const singular={vehiculos:'vehículo',animales:'animal',cartas:'carta'},plural={vehiculos:'vehículos',animales:'animales',cartas:'cartas'};
  $('#results').textContent=result.length+' '+(result.length===1?singular[section]:plural[section]);
  const fragment=document.createDocumentFragment();
  if(!result.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No hay resultados con estos filtros.';fragment.append(empty)}
  if(comparing){
    const header=document.createElement('div');header.className='compare-head';header.setAttribute('role','row');
    const title=document.createElement('div');title.textContent=section==='vehiculos'?'Vehículo':section==='animales'?'Animal':'Carta';header.append(title);
    for(const p of PLAYERS){const h=document.createElement('div'),initial=document.createElement('span');initial.className='head-initial';initial.textContent=p.name[0];h.append(initial,document.createTextNode(p.name));header.append(h)}fragment.append(header);
  }
  if(section==='cartas'){
    for(const [set,total] of CARD_SETS){const group=result.filter(v=>v.categoria===set);if(!group.length)continue;
      const head=document.createElement('div');head.className='set-section';const heading=document.createElement('h3');heading.textContent=set;
      const progress=document.createElement('span');progress.textContent=comparing?group.length+' cartas':CARDS.filter(c=>c.categoria===set&&activeMarks().has(c.id)).length+' / '+total;
      head.append(heading,progress);fragment.append(head);for(const v of group)fragment.append(comparing?compareRow(v):itemButton(v));
    }
  }else for(const v of result)fragment.append(comparing?compareRow(v):itemButton(v));
  container.append(fragment);
}
const states={vehiculos:{heading:'Colección de vehículos',hero:'GARAGE',eyebrow:'VEHÍCULOS',subtitle:'277 modelos base · 281 versiones especiales',target:'Escaneos para el 100 %',placeholder:'Buscar vehículo o marca…'},animales:{heading:'Colección de animales',hero:'WILDLIFE',eyebrow:'ANIMALES',subtitle:'255 animales · 8 categorías',target:'Estudiados para el 100 %',placeholder:'Buscar animal…'},cartas:{heading:'Cartas coleccionables',hero:'CARDS',eyebrow:'CARTAS',subtitle:'480 cartas · 18 colecciones',target:'Colecciones para el 100 %',placeholder:'Buscar carta o colección…'}};
function updatePlayerControls(){
  document.querySelectorAll('[data-profile]').forEach(b=>{if(!b.classList.contains('profile-tab'))return;const yes=b.dataset.profile===player;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes));b.tabIndex=comparing?-1:0});

  $('#compareToggleLabel').textContent=comparing?'Salir de comparación':'Comparar jugadores';

  document.querySelectorAll('.profile-tab').forEach(b=>b.disabled=comparing);

function switchSection(next,changeHash=true){
  if(!states[next])next='vehiculos';section=next;
  kind='all';status='all';category='';query='';sorting='model';diff='all';hasPlayer='';missingPlayer='';
  $('#q').value='';$('#q').placeholder=states[next].placeholder;$('#sort').value='model';
  $('#sort').options[0].textContent=next==='cartas'?'Orden de la colección':'Nombre A-Z';$('#sort').options[1].textContent=next==='vehiculos'?'Marca A-Z':next==='cartas'?'Nombre A-Z':'Categoría A-Z';
  $('#catalogHeading').textContent=states[next].heading;$('#heroEyebrow').textContent='GTA VI / '+states[next].eyebrow;
  $('#heroTitle').textContent=states[next].hero;$('#catalogSubtitle').textContent=states[next].subtitle;$('#targetLabel').textContent=states[next].target;
  $('#typeTabs').hidden=next!=='vehiculos';
  document.querySelectorAll('[data-section]').forEach(btn=>{const yes=btn.dataset.section===next;btn.classList.toggle('active',yes);if(yes)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current')});
  document.querySelectorAll('[data-type]').forEach(b=>{const yes=b.dataset.type==='all';b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});
  document.querySelectorAll('[data-status]').forEach(b=>{const yes=b.dataset.status==='all';b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});
  document.querySelectorAll('[data-diff]').forEach(b=>{const yes=b.dataset.diff==='all';b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});
  $('#hasPlayer').value='';$('#missingPlayer').value='';updatePlayerControls();options();render();
  if(changeHash&&location.hash!==('#'+next))history.replaceState(null,'','#'+next);
}
